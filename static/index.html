<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recalbox ROM Manager</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg-deep: #0a0e17;
  --bg-card: #111827;
  --bg-card-hover: #1a2234;
  --bg-input: #0d1320;
  --border: #1e2d44;
  --border-hover: #2d4466;
  --text: #e2e8f0;
  --text-dim: #64748b;
  --text-muted: #475569;
  --accent: #38bdf8;
  --accent-glow: rgba(56, 189, 248, 0.15);
  --green: #34d399;
  --green-dim: rgba(52, 211, 153, 0.15);
  --red: #f87171;
  --red-dim: rgba(248, 113, 113, 0.12);
  --yellow: #fbbf24;
  --yellow-dim: rgba(251, 191, 36, 0.12);
  --orange: #fb923c;
  --purple: #a78bfa;
  --cyan: #06b6d4;
  --radius: 10px;
  --radius-sm: 6px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Outfit', sans-serif;
  background: var(--bg-deep);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* Background grid pattern */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(56, 189, 248, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(56, 189, 248, 0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}

.app { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; padding: 20px; }

/* ─── Header ─── */
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 24px 0; margin-bottom: 24px;
  border-bottom: 1px solid var(--border);
}
.header h1 {
  font-size: 1.75rem; font-weight: 800;
  background: linear-gradient(135deg, var(--accent), var(--purple));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  letter-spacing: -0.5px;
}
.header h1 span { font-size: 0.65em; font-weight: 400; opacity: 0.7; }
.header-actions { display: flex; gap: 10px; align-items: center; }

/* ─── Buttons ─── */
.btn {
  font-family: 'Outfit', sans-serif;
  padding: 8px 18px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: var(--bg-card);
  color: var(--text); cursor: pointer; font-size: 0.85rem; font-weight: 500;
  transition: all 0.15s ease; display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { border-color: var(--border-hover); background: var(--bg-card-hover); }
.btn-primary {
  background: linear-gradient(135deg, #1d4ed8, #2563eb);
  border-color: #3b82f6; color: #fff;
}
.btn-primary:hover { background: linear-gradient(135deg, #2563eb, #3b82f6); }
.btn-danger { border-color: var(--red); color: var(--red); }
.btn-danger:hover { background: var(--red-dim); }
.btn-success { border-color: var(--green); color: var(--green); }
.btn-success:hover { background: var(--green-dim); }
.btn-sm { padding: 4px 10px; font-size: 0.78rem; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* ─── Config Bar ─── */
.config-bar {
  display: flex; gap: 10px; align-items: center;
  padding: 14px 18px; background: var(--bg-card);
  border: 1px solid var(--border); border-radius: var(--radius);
  margin-bottom: 20px;
}
.config-bar input {
  flex: 1; padding: 8px 12px; background: var(--bg-input);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  color: var(--text); font-family: 'JetBrains Mono', monospace;
  font-size: 0.85rem;
}
.config-bar input:focus { outline: none; border-color: var(--accent); }
.config-status {
  font-size: 0.8rem; padding: 4px 10px; border-radius: 20px;
  font-weight: 600;
}
.config-status.ok { background: var(--green-dim); color: var(--green); }
.config-status.err { background: var(--red-dim); color: var(--red); }

/* ─── Stats Grid ─── */
.stats-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px; margin-bottom: 24px;
}
.stat-card {
  padding: 18px; background: var(--bg-card);
  border: 1px solid var(--border); border-radius: var(--radius);
  text-align: center;
}
.stat-card .stat-value {
  font-size: 2rem; font-weight: 800;
  font-family: 'JetBrains Mono', monospace;
  color: var(--accent);
}
.stat-card .stat-label {
  font-size: 0.75rem; color: var(--text-dim);
  text-transform: uppercase; letter-spacing: 1px; margin-top: 4px;
}
.stat-card.warning .stat-value { color: var(--yellow); }
.stat-card.danger .stat-value { color: var(--red); }
.stat-card.clickable { cursor: pointer; transition: border-color 0.2s, transform 0.15s; }
.stat-card.clickable:hover { border-color: var(--accent); transform: translateY(-2px); }

/* ─── Tabs ─── */
.tabs {
  display: flex; gap: 2px; margin-bottom: 20px;
  border-bottom: 1px solid var(--border); padding-bottom: 0;
}
.tab {
  padding: 10px 20px; cursor: pointer; font-size: 0.85rem; font-weight: 500;
  color: var(--text-dim); border-bottom: 2px solid transparent;
  transition: all 0.15s; background: none; border-top: none;
  border-left: none; border-right: none; font-family: 'Outfit', sans-serif;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab .badge {
  background: var(--red-dim); color: var(--red); font-size: 0.7rem;
  padding: 1px 7px; border-radius: 10px; margin-left: 6px; font-weight: 700;
}

/* ─── Search ─── */
.search-bar {
  position: relative; margin-bottom: 16px;
}
.search-bar input {
  width: 100%; padding: 10px 14px 10px 38px;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-sm); color: var(--text);
  font-size: 0.9rem; font-family: 'Outfit', sans-serif;
}
.search-bar input:focus { outline: none; border-color: var(--accent); }
.search-bar::before {
  content: '⌕'; position: absolute; left: 12px; top: 50%;
  transform: translateY(-50%); color: var(--text-dim); font-size: 1.1rem;
}

/* ─── Systems Grid ─── */
.systems-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 12px;
}
.system-card {
  padding: 16px; background: var(--bg-card);
  border: 1px solid var(--border); border-radius: var(--radius);
  cursor: pointer; transition: all 0.15s;
}
.system-card:hover { border-color: var(--border-hover); background: var(--bg-card-hover); transform: translateY(-1px); }
.system-card.has-issues { border-left: 3px solid var(--yellow); }
.system-card .sys-name { font-weight: 600; font-size: 0.95rem; margin-bottom: 2px; }
.system-card .sys-folder {
  font-family: 'JetBrains Mono', monospace; font-size: 0.75rem;
  color: var(--text-dim); margin-bottom: 10px;
}
.system-card .sys-stats { display: flex; gap: 12px; font-size: 0.8rem; }
.system-card .sys-stats span { display: flex; align-items: center; gap: 4px; }
.sys-ok { color: var(--green); }
.sys-warn { color: var(--yellow); }
.sys-err { color: var(--red); }

/* ─── ROM Table ─── */
.rom-table-wrap {
  overflow-x: auto; background: var(--bg-card);
  border: 1px solid var(--border); border-radius: var(--radius);
}
table { width: 100%; border-collapse: collapse; }
th {
  text-align: left; padding: 10px 14px; font-size: 0.72rem;
  text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim);
  border-bottom: 1px solid var(--border); background: rgba(0,0,0,0.2);
  position: sticky; top: 0;
}
td { padding: 8px 14px; border-bottom: 1px solid rgba(30,45,68,0.5); font-size: 0.85rem; }
tr:hover td { background: rgba(56, 189, 248, 0.03); }
.rom-name { font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; word-break: break-all; }
.rom-ext {
  font-family: 'JetBrains Mono', monospace; font-size: 0.75rem;
  padding: 2px 6px; border-radius: 3px;
  background: rgba(56, 189, 248, 0.1); color: var(--accent);
}
.rom-size { color: var(--text-dim); font-size: 0.8rem; white-space: nowrap; }
.issue-badge {
  font-size: 0.72rem; padding: 2px 8px; border-radius: 10px; font-weight: 600;
}
.issue-badge.ok { background: var(--green-dim); color: var(--green); }
.issue-badge.wrong { background: var(--yellow-dim); color: var(--yellow); }
.issue-badge.unknown { background: var(--red-dim); color: var(--red); }

/* ─── Issues Panel ─── */
.issue-row {
  display: flex; align-items: center; gap: 12px; padding: 12px 16px;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-sm); margin-bottom: 8px;
}
.issue-row .issue-icon { font-size: 1.3rem; flex-shrink: 0; }
.issue-row .issue-details { flex: 1; }
.issue-row .issue-file {
  font-family: 'JetBrains Mono', monospace; font-size: 0.82rem;
  font-weight: 600;
}
.issue-row .issue-desc { font-size: 0.78rem; color: var(--text-dim); margin-top: 2px; }
.issue-actions { display: flex; gap: 6px; flex-shrink: 0; }

/* ─── Diagnostics ─── */
.diag-badge {
  font-size: 0.72rem; padding: 2px 8px; border-radius: 10px; font-weight: 600;
  background: rgba(167, 139, 250, 0.15); color: var(--purple); cursor: pointer;
}
.diag-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-left: 3px solid var(--purple); border-radius: var(--radius-sm);
  margin-bottom: 10px; overflow: hidden;
}
.diag-card-header {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; cursor: pointer;
}
.diag-card-header:hover { background: rgba(167,139,250,0.05); }
.diag-card-header .diag-title { font-weight: 600; font-size: 0.88rem; color: var(--purple); }
.diag-card-header .diag-file { font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; }
.diag-card-header .diag-system { font-size: 0.75rem; color: var(--text-dim); margin-left: auto; white-space: nowrap; }
.diag-card-body { padding: 12px 14px; border-top: 1px solid var(--border); background: rgba(0,0,0,0.15); }
.diag-card-body p { font-size: 0.83rem; color: var(--text-dim); margin-bottom: 10px; }
.diag-steps { list-style: decimal; padding-left: 18px; }
.diag-steps li { font-size: 0.82rem; margin-bottom: 6px; line-height: 1.5; }
.diag-steps li pre { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; background: var(--bg-input); padding: 6px 10px; border-radius: 4px; margin-top: 4px; white-space: pre-wrap; color: var(--accent); }
.diag-search-link { display: inline-flex; align-items: center; gap: 5px; margin-top: 8px; font-size: 0.8rem; color: var(--accent); text-decoration: none; }
.diag-search-link:hover { text-decoration: underline; }
.bios-table { width: 100%; border-collapse: collapse; margin-bottom: 24px; }
.bios-table th { text-align: left; padding: 8px 12px; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); border-bottom: 1px solid var(--border); background: rgba(0,0,0,0.2); }
.bios-table td { padding: 8px 12px; border-bottom: 1px solid rgba(30,45,68,0.4); font-size: 0.83rem; }
.bios-ok { color: var(--green); font-weight: 600; }
.bios-missing { color: var(--red); font-weight: 600; }
.bios-wrong { color: var(--yellow); font-weight: 600; }
.bios-optional { color: var(--text-muted); }

/* ─── Modal ─── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000; backdrop-filter: blur(4px);
}
.modal {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 24px; min-width: 400px;
  max-width: 90vw; max-height: 80vh; overflow-y: auto;
}
.modal h3 { margin-bottom: 16px; font-size: 1.1rem; }
.modal select {
  width: 100%; padding: 8px 12px; background: var(--bg-input);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  color: var(--text); font-family: 'Outfit', sans-serif;
  font-size: 0.9rem; margin-bottom: 16px;
}
.modal select:focus { outline: none; border-color: var(--accent); }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; }

/* ─── Loading / Empty ─── */
.loading { text-align: center; padding: 60px 20px; color: var(--text-dim); }
.loading .spinner {
  width: 40px; height: 40px; border: 3px solid var(--border);
  border-top-color: var(--accent); border-radius: 50%;
  animation: spin 0.8s linear infinite; margin: 0 auto 16px;
}
.scan-progress .spinner {
  width: 28px; height: 28px; border: 3px solid var(--border);
  border-top-color: var(--accent); border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.empty-state { text-align: center; padding: 60px 20px; color: var(--text-dim); }
.empty-state .emoji { font-size: 2.5rem; margin-bottom: 12px; }

/* ─── Back nav ─── */
.breadcrumb {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 16px; font-size: 0.85rem;
}
.breadcrumb a {
  color: var(--accent); text-decoration: none; cursor: pointer;
}
.breadcrumb a:hover { text-decoration: underline; }
.breadcrumb .sep { color: var(--text-muted); }

/* ─── Pagination ─── */
.pagination {
  display: flex; align-items: center; justify-content: center;
  gap: 8px; padding: 16px 0;
}
.pagination .page-info { font-size: 0.8rem; color: var(--text-dim); }

/* ─── Toast ─── */
.toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 2000; }
.toast {
  padding: 12px 18px; border-radius: var(--radius-sm);
  margin-top: 8px; font-size: 0.85rem; font-weight: 500;
  animation: slideIn 0.3s ease;
  border: 1px solid;
}
.toast.success { background: var(--green-dim); color: var(--green); border-color: var(--green); }
.toast.error { background: var(--red-dim); color: var(--red); border-color: var(--red); }
.toast.info { background: var(--accent-glow); color: var(--accent); border-color: var(--accent); }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: none; opacity: 1; } }

/* ─── Cover Lightbox ─── */
.cover-lightbox {
  display: flex; align-items: center; justify-content: center;
  cursor: zoom-out;
}
.cover-lightbox img {
  max-width: 90vw; max-height: 80vh; object-fit: contain;
  border-radius: var(--radius); box-shadow: 0 0 40px rgba(0,0,0,0.8);
}

/* ─── Cover thumbnail in ROM table ─── */
.cover-thumb {
  width: 40px; height: 40px; object-fit: contain;
  border-radius: 3px; cursor: pointer; display: block;
  background: rgba(0,0,0,0.2);
}
.cover-missing {
  width: 40px; height: 40px; display: flex; align-items: center;
  justify-content: center; font-size: 1.2rem; color: var(--text-muted);
  border: 1px dashed var(--border); border-radius: 3px;
}

/* ─── SS Config panel ─── */
.ss-config-panel {
  border-top: 1px solid var(--border); padding-top: 10px;
  margin-top: 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
}
.ss-config-panel input {
  width: 160px; flex: none;
}

/* ─── Netflix Browse Mode ─── */
.browse-container { max-height: 78vh; overflow-y: auto; padding: 4px 0; }
.browse-filter-bar {
  display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap;
}
.browse-filter-bar input {
  flex: 1; min-width: 200px; padding: 8px 12px; background: var(--bg-card);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  color: var(--text); font-size: 0.85rem; font-family: 'Outfit', sans-serif;
}
.browse-filter-bar select {
  padding: 8px 12px; background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-sm); color: var(--text); font-size: 0.85rem;
  font-family: 'Outfit', sans-serif; cursor: pointer;
}
.browse-row { margin-bottom: 28px; }
.browse-row-header {
  display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px;
  padding: 0 4px;
}
.browse-row-header h3 {
  font-size: 1.1rem; font-weight: 600; color: var(--text);
}
.browse-row-header .browse-count {
  font-size: 0.78rem; color: var(--text-muted);
}
.browse-row-wrap { position: relative; }
.browse-row-scroll {
  display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory;
  padding: 8px 4px 12px; scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
.browse-row-scroll::-webkit-scrollbar { height: 6px; }
.browse-row-scroll::-webkit-scrollbar-track { background: transparent; }
.browse-row-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.browse-row-scroll::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }

.browse-card {
  width: 150px; min-width: 150px; scroll-snap-align: start;
  cursor: pointer; border-radius: var(--radius); overflow: hidden;
  background: var(--bg-card); border: 1px solid var(--border);
  transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
  position: relative; flex-shrink: 0;
}
.browse-card:hover {
  transform: translateY(-6px); border-color: var(--accent);
  box-shadow: 0 8px 24px rgba(56, 189, 248, 0.15);
}
.browse-card-img {
  width: 150px; height: 200px; overflow: hidden;
  background: var(--bg-input); display: flex; align-items: center; justify-content: center;
}
.browse-card-img img { width: 100%; height: 100%; object-fit: cover; }
.browse-card-placeholder {
  font-size: 2.5rem; color: var(--text-muted); opacity: 0.4;
  display: flex; align-items: center; justify-content: center;
  width: 100%; height: 100%;
}
.browse-card-name {
  padding: 8px 10px; font-size: 0.78rem; font-weight: 500;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  color: var(--text);
}
.browse-card-overlay {
  position: absolute; inset: 0; background: rgba(10, 14, 23, 0.92);
  padding: 14px 12px; display: flex; flex-direction: column; justify-content: flex-end;
  gap: 4px; font-size: 0.75rem; color: var(--text-dim);
  opacity: 0; transition: opacity 0.2s ease; pointer-events: none;
}
.browse-card:hover .browse-card-overlay { opacity: 1; }
.browse-card-overlay .overlay-title {
  font-size: 0.85rem; font-weight: 600; color: var(--text);
  margin-bottom: 4px; line-height: 1.3;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.browse-card-overlay .overlay-desc {
  font-size: 0.72rem; color: var(--text-dim); line-height: 1.4;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
.browse-card-overlay .overlay-meta {
  font-size: 0.7rem; color: var(--text-muted); margin-top: auto;
}
.catalog-systembar { display: flex; gap: 8px; flex-wrap: wrap; }
.catalog-pager { display: flex; gap: 8px; align-items: center; }
.catalog-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 12px;
}
.catalog-card {
  border-radius: var(--radius); overflow: hidden;
  background: var(--bg-card); border: 1px solid var(--border);
  display: flex; flex-direction: column;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}
.catalog-card:hover { border-color: var(--accent); box-shadow: 0 6px 18px rgba(56, 189, 248, 0.12); }
.catalog-card .browse-card-img { width: 100%; height: 190px; }
.catalog-card-meta {
  padding: 0 10px 6px; font-size: 0.72rem; color: var(--text-muted);
}
.catalog-card-action { padding: 0 10px 10px; margin-top: auto; }
.browse-scroll-btn {
  position: absolute; top: 50%; transform: translateY(-50%); z-index: 2;
  width: 36px; height: 36px; border-radius: 50%;
  background: rgba(17, 24, 39, 0.9); border: 1px solid var(--border);
  color: var(--text); cursor: pointer; font-size: 1rem;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s, border-color 0.15s;
  backdrop-filter: blur(4px);
}
.browse-scroll-btn:hover { background: var(--bg-card-hover); border-color: var(--accent); }
.browse-scroll-btn.left { left: -4px; }
.browse-scroll-btn.right { right: -4px; }
.browse-row-skeleton {
  height: 260px; background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); display: flex; align-items: center; justify-content: center;
  color: var(--text-muted); font-size: 0.85rem;
}
.browse-show-more {
  min-width: 80px; height: 200px; display: flex; align-items: center; justify-content: center;
  background: var(--bg-card); border: 1px dashed var(--border); border-radius: var(--radius);
  color: var(--accent); font-size: 0.78rem; cursor: pointer; flex-shrink: 0;
  transition: background 0.15s, border-color 0.15s;
}
.browse-show-more:hover { background: var(--accent-glow); border-color: var(--accent); }

/* ─── Metadata Edit Modal ─── */
.edit-modal { min-width: 620px; max-width: 800px; }
.edit-modal-grid {
  display: grid; grid-template-columns: 200px 1fr; gap: 20px; margin-top: 16px;
}
.edit-modal-cover {
  width: 200px; border-radius: var(--radius); overflow: hidden;
  background: var(--bg-input); border: 1px solid var(--border);
}
.edit-modal-cover img { width: 100%; display: block; }
.edit-modal-cover-placeholder {
  width: 200px; height: 266px; display: flex; align-items: center; justify-content: center;
  font-size: 3rem; color: var(--text-muted); opacity: 0.3;
}
.edit-cover-actions {
  margin-top: 8px; display: flex; flex-direction: column; gap: 6px;
}
.edit-cover-url-row { display: flex; gap: 4px; }
.edit-cover-url-row input {
  flex: 1; padding: 5px 8px; font-size: 0.75rem;
  background: var(--bg-input); border: 1px solid var(--border);
  border-radius: var(--radius-sm); color: var(--text);
  font-family: 'JetBrains Mono', monospace;
}
.edit-field { margin-bottom: 14px; }
.edit-field label {
  display: block; font-size: 0.75rem; color: var(--text-dim);
  text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; font-weight: 500;
}
.edit-field input, .edit-field textarea {
  width: 100%; padding: 8px 12px; background: var(--bg-input);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  color: var(--text); font-size: 0.85rem; font-family: 'Outfit', sans-serif;
  transition: border-color 0.15s;
}
.edit-field input:focus, .edit-field textarea:focus {
  outline: none; border-color: var(--accent);
}
.edit-field textarea { min-height: 100px; resize: vertical; line-height: 1.5; }
.edit-rating { display: flex; gap: 2px; align-items: center; }
.edit-rating .star {
  font-size: 1.4rem; cursor: pointer; transition: color 0.1s, transform 0.1s;
  user-select: none;
}
.edit-rating .star:hover { transform: scale(1.2); }
.edit-rating .star.filled { color: var(--yellow); }
.edit-rating .star.empty { color: var(--text-muted); }
.edit-modal-footer {
  display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px;
  padding-top: 14px; border-top: 1px solid var(--border);
}
.edit-modal-info {
  font-size: 0.75rem; color: var(--text-muted);
  display: flex; gap: 12px; margin-top: 6px;
}

/* ─── Responsive ─── */
@media (max-width: 768px) {
  .header { flex-direction: column; gap: 12px; text-align: center; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .systems-grid { grid-template-columns: 1fr; }
  .config-bar { flex-direction: column; }
  .modal { min-width: auto; margin: 16px; }
  .edit-modal { min-width: auto; }
  .edit-modal-grid { grid-template-columns: 1fr; }
  .browse-card { width: 130px; min-width: 130px; }
  .browse-card-img { width: 130px; height: 173px; }
}

/* ─── Footer ─── */
.footer {
  margin-top: 48px; padding: 20px 0 16px;
  border-top: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 12px;
  font-size: 0.78rem; color: var(--text-dim);
}
.footer a { color: var(--text-dim); text-decoration: none; transition: color 0.15s; }
.footer a:hover { color: var(--accent); }
.btn-star {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 14px; border-radius: var(--radius-sm);
  border: 1px solid #30363d; background: #21262d;
  color: #e6edf3; font-size: 0.8rem; font-weight: 500;
  cursor: pointer; text-decoration: none;
  transition: all 0.15s ease;
}
.btn-star:hover { background: #30363d; border-color: #8b949e; color: #e6edf3; }
.btn-star svg { width: 14px; height: 14px; fill: #e3b341; }
</style>
</head>
<body>
<div class="app" id="app"></div>
<input type="file" id="biosFileInput" style="display:none" accept="*/*">

<script>
const API = window.location.origin + '/api';
const state = {
  config: { share_path: '\\\\RECALBOX\\share', accessible: false },
  stats: null,
  lastScan: null,
  systems: {},
  issues: [],
  duplicates: [],
  activeTab: 'systems',
  selectedSystem: null,
  searchQuery: '',
  searchResults: [],
  scanning: false,
  scanProgress: null,   // {running, phase, systems_total, systems_done, current_system, files_so_far}
  loading: true,
  modal: null,
  toasts: [],
  romPage: 0,
  ROM_PAGE_SIZE: 100,
  romFilter: '',
  hideEmptySystems: true,
  issueFilter: 'all',
  diagnostics: [],
  biosStatus: {},
  diagFilter: 'all',
  expandedDiag: {},
  missingCovers: [],
  coverScraping: {},
  scrapeQueue: [],
  scrapingBulk: false,
  coverSystemFilter: 'all',
  missingDescriptions: [],
  descScraping: {},
  descScrapeQueue: [],
  descScrapingBulk: false,
  descSystemFilter: 'all',
  showSsConfig: false,
  ssUser: '',
  ssDevId: '',
  ssConfigured: false,
  // Browse mode
  browseFilter: '',
  browseSystemFilter: 'all',
  browseExpandedSystems: {},
  // Metadata edit modal
  editModal: null,
  editSaving: false,
  // Knowledge Base
  kbFilter: '',
  kbCategoryFilter: 'all',
  kbEntries: {},
  // Auto-fix in-progress tracking keyed "system/filename"
  fixing: {},
  // Bug report modal
  bugReport: { open: false, title: '', description: '', snapshot: null, loading: false },
  // Update-available banner
  updateAvailable: null,
  // Session-local submitted reports (mirrors /api/kb/reports, reset on reload)
  userReports: [],
  // Download ROMs catalog
  catalogSystemsList: null,   // [{system,name,count}] or null until first load
  catalogSystem: null,        // selected system key
  catalog: [],                // current page of games
  catalogTotal: 0,
  catalogPage: 0,
  catalogQuery: '',
  catalogLoading: false,
  catalogDownloading: {},     // "system/filename" -> true
  catalogQueue: [],
  catalogBulk: false,
};

// ─── API Helpers ─────────────────────────────────────────────────────────────
async function api(path, opts = {}) {
  try {
    const r = await fetch(API + path, {
      headers: { 'Content-Type': 'application/json' },
      ...opts,
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    });
    return await r.json();
  } catch (e) {
    toast('Connection error: ' + e.message, 'error');
    return { error: e.message };
  }
}

function toast(msg, type = 'info') {
  const t = { msg, type, id: Date.now() };
  state.toasts.push(t);
  render();
  setTimeout(() => {
    state.toasts = state.toasts.filter(x => x.id !== t.id);
    render();
  }, 3500);
}

// ─── Actions ─────────────────────────────────────────────────────────────────
async function init() {
  const cfg = await api('/config');
  if (!cfg.error) {
    state.config = cfg;
    state.ssUser = cfg.screenscraper_user || '';
    state.ssDevId = cfg.screenscraper_devid || '';
    state.ssConfigured = cfg.screenscraper_configured || false;
  }
  const st = await api('/status');
  if (st.stats && st.stats.total_files !== undefined) {
    state.stats = st.stats;
    state.lastScan = st.last_scan;
    // A previous scan is cached server-side — load the systems grid so it isn't empty.
    const sys = await api('/systems');
    if (!sys.error) state.systems = sys;
    const [covers, descs] = await Promise.all([api('/covers/missing'), api('/descriptions/missing')]);
    if (Array.isArray(covers)) state.missingCovers = covers;
    if (Array.isArray(descs)) state.missingDescriptions = descs;
  }
  state.loading = false;
  render();
  loadKB();
  checkForUpdates();
  loadUserReports();
}

async function loadKB() {
  const r = await api('/kb');
  if (r.entries) { state.kbEntries = r.entries; render(); }
}

async function checkForUpdates() {
  try {
    const r = await api('/version/check');
    if (r.has_update && r.latest && r.release_url) {
      state.updateAvailable = { latest: r.latest, url: r.release_url, notes: r.release_notes_short || '' };
      render();
    }
  } catch (_) { /* silently ignore — user may be offline */ }
}

async function loadUserReports() {
  const r = await api('/kb/reports');
  if (r.reports) { state.userReports = r.reports; }
}

async function openBugReport(prefillTitle = '') {
  state.bugReport = { open: true, title: prefillTitle, description: '', snapshot: null, loading: true };
  render();
  const snap = await api('/diagnostics/snapshot');
  state.bugReport.snapshot = snap.error ? null : snap;
  state.bugReport.loading = false;
  render();
}

function closeBugReport() {
  state.bugReport = { open: false, title: '', description: '', snapshot: null, loading: false };
  render();
}

function buildGithubIssueBody(snapshot, title, desc) {
  const env = snapshot?.env || {};
  const scan = snapshot?.scan || {};
  const diagByType = snapshot?.diagnostics_by_type || {};
  const logs = snapshot?.recent_logs || [];

  const diagLines = Object.entries(diagByType)
    .map(([k, v]) => `| \`${k}\` | ${v.severity} | ${v.count} | ${v.auto_fix ? 'Yes' : 'No'} | ${v.sample_files.join(', ')} |`)
    .join('\n');
  const diagTable = Object.keys(diagByType).length
    ? `| Type | Severity | Count | Auto-Fix | Sample Files |\n|------|----------|-------|----------|--------------|\n${diagLines}`
    : '_No diagnostic issues recorded._';

  const statsStr = scan.stats && Object.keys(scan.stats).length
    ? Object.entries(scan.stats).map(([k, v]) => `- **${k}**: ${v}`).join('\n')
    : '_No scan data._';

  const logsBlock = logs.length
    ? '```\n' + logs.join('\n') + '\n```'
    : '_No recent log entries._';

  return [
    '## Description',
    desc || '_Please describe your issue here._',
    '',
    '## Environment',
    `- **App version**: ${env.app_version || 'unknown'}`,
    `- **Python**: ${env.python_version || 'unknown'}`,
    `- **Platform**: ${env.platform || 'unknown'}`,
    `- **py7zr available**: ${env.py7zr_available}`,
    `- **Share accessible**: ${env.share_accessible}`,
    '',
    '## Scan Stats',
    `- **Last scan**: ${scan.last_scan || 'never'}`,
    statsStr,
    '',
    '## Diagnostic Issues',
    diagTable,
    '',
    '## Recent Logs (last 50 lines)',
    logsBlock,
    '',
    '---',
    `_Generated by Recalbox ROM Manager v${env.app_version || 'unknown'}_`,
  ].join('\n');
}

async function submitBugReport() {
  const { title, description, snapshot } = state.bugReport;
  const safeTitle = title.trim() || 'Unknown issue';
  const body = buildGithubIssueBody(snapshot, safeTitle, description);
  const issueUrl = 'https://github.com/crs2007/recalbox-manager/issues/new'
    + '?title=' + encodeURIComponent(safeTitle)
    + '&body=' + encodeURIComponent(body);
  // Log report to session store (best-effort, non-blocking)
  api('/kb/report', { method: 'POST', body: { title: safeTitle } })
    .then(r => { if (r.ok) loadUserReports(); });
  window.open(issueUrl, '_blank', 'noopener,noreferrer');
  closeBugReport();
  toast('Opening GitHub — paste any extra details into the issue form', 'success');
}

async function copyBugReport() {
  const { title, description, snapshot } = state.bugReport;
  const safeTitle = title.trim() || 'Unknown issue';
  const body = buildGithubIssueBody(snapshot, safeTitle, description);
  try {
    await navigator.clipboard.writeText('# ' + safeTitle + '\n\n' + body);
    toast('Copied to clipboard', 'success');
  } catch (_) {
    toast('Clipboard copy failed — use "Open GitHub Issue" instead', 'error');
  }
}

function renderBugReportModal() {
  const br = state.bugReport;
  if (!br.open) return '';

  const snap = br.snapshot;
  const env = snap?.env || {};
  const diagByType = snap?.diagnostics_by_type || {};
  const diagCount = Object.values(diagByType).reduce((s, v) => s + v.count, 0);

  const snapPreview = br.loading
    ? `<p style="color:var(--text-dim);font-size:0.82rem;margin-top:8px">⟳ Collecting diagnostic data…</p>`
    : snap
      ? `<details style="margin-top:12px">
          <summary style="cursor:pointer;font-size:0.82rem;color:var(--text-dim);user-select:none">▶ Collected Data Preview (${diagCount} diagnostic findings)</summary>
          <div style="margin-top:8px;padding:10px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:0.78rem;font-family:'JetBrains Mono',monospace;white-space:pre-wrap;max-height:200px;overflow-y:auto;color:var(--text-dim)">App v${escHtml(env.app_version||'?')} · Python ${escHtml((env.python_version||'?').split(' ')[0])} · ${escHtml(env.platform||'?')}
py7zr: ${env.py7zr_available} · Share: ${env.share_accessible}
Last scan: ${escHtml(snap.scan?.last_scan||'never')}
Diagnostics: ${diagCount} issues across ${Object.keys(diagByType).length} type(s)
${Object.entries(diagByType).map(([k,v])=>`  ${k}: ${v.count} (${v.severity})`).join('\n')}</div>
        </details>`
      : `<p style="color:var(--text-dim);font-size:0.82rem;margin-top:8px">⚠ Could not collect diagnostic data (run a scan first to include stats)</p>`;

  return `
    <div class="modal-overlay" onclick="if(event.target===this)closeBugReport()">
      <div class="modal" style="max-width:560px;width:100%">
        <h3 style="margin-bottom:4px">⚠ Report Issue</h3>
        <p style="font-size:0.82rem;color:var(--text-dim);margin-bottom:16px">
          Opens a pre-filled GitHub issue with diagnostic data attached. You'll need a GitHub account to submit.
        </p>
        <label style="display:block;margin-bottom:4px;font-size:0.82rem;color:var(--text-dim)">Issue title</label>
        <input type="text" id="bugReportTitle" value="${escHtml(br.title)}"
          placeholder="Briefly describe the problem…"
          style="width:100%;padding:8px 12px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:0.85rem;margin-bottom:12px;box-sizing:border-box"
          oninput="state.bugReport.title=this.value" />
        <label style="display:block;margin-bottom:4px;font-size:0.82rem;color:var(--text-dim)">Additional details (optional)</label>
        <textarea id="bugReportDesc"
          placeholder="Steps to reproduce, what you expected, what happened…"
          style="width:100%;height:90px;padding:8px 12px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:0.85rem;resize:vertical;font-family:'Outfit',sans-serif;box-sizing:border-box"
          oninput="state.bugReport.description=this.value">${escHtml(br.description)}</textarea>
        ${snapPreview}
        <div class="modal-actions" style="margin-top:16px">
          <button class="btn" onclick="closeBugReport()">Cancel</button>
          <button class="btn" onclick="copyBugReport()" ${br.loading ? 'disabled' : ''}>📋 Copy to Clipboard</button>
          <button class="btn btn-primary" onclick="submitBugReport()" ${br.loading ? 'disabled' : ''}>
            ${br.loading ? '⟳ Loading…' : '⚠ Open GitHub Issue'}
          </button>
        </div>
      </div>
    </div>
  `;
}

async function updateConfig(sharePath) {
  const r = await api('/config', { method: 'POST', body: { share_path: sharePath } });
  if (!r.error) { state.config = r; toast('Path updated', 'success'); }
  render();
}

const sleep = ms => new Promise(res => setTimeout(res, ms));

async function startScan() {
  state.scanning = true;
  state.scanProgress = { running: true, phase: 'inventory', systems_total: 0, systems_done: 0, current_system: null, files_so_far: 0 };
  // Clear browse cache so fresh data is loaded
  Object.keys(browseRomsCache).forEach(k => delete browseRomsCache[k]);
  render();
  toast('Scanning ROMs...', 'info');

  const start = await api('/scan', { method: 'POST' });
  if (start && start.error) {
    state.scanning = false; state.scanProgress = null;
    const cfg = await api('/config');
    if (!cfg.error) state.config = cfg;
    toast(start.error, 'error'); render(); return;
  }

  // Poll progress until the background scan finishes. Systems and climbing counts stream in
  // so the user can start working before the deep analysis completes. Skip polling if the
  // backend completed the scan synchronously (older builds return stats directly), and stop
  // polling if /scan/progress is unavailable (e.g. server not restarted after an update) —
  // either way we fall through to the consolidated loads below.
  if (!(start && start.stats)) {
    let pollErrors = 0;
    while (true) {
      const p = await api('/scan/progress');
      if (p && !p.error) {
        pollErrors = 0;
        state.scanProgress = p.progress || null;
        if (p.systems) state.systems = p.systems;
        if (p.stats) state.stats = p.stats;
        if (p.last_scan) state.lastScan = p.last_scan;
        render();
        const phase = p.progress && p.progress.phase;
        if (phase === 'error') {
          state.scanning = false; state.scanProgress = null;
          const cfg = await api('/config');
          if (!cfg.error) state.config = cfg;
          toast((p.progress && p.progress.error) || 'Scan failed', 'error'); render(); return;
        }
        if (phase === 'done') break;
      } else if (++pollErrors >= 5) {
        // Progress endpoint unreachable — stop polling and load results directly.
        break;
      }
      await sleep(700);
    }
  }

  state.scanning = false;

  // Final consolidated loads. Always refetch /systems and /status so the grid and stats are
  // populated regardless of how the scan completed (streaming poll, sync, or fallback).
  const sys = await api('/systems');
  if (!sys.error) state.systems = sys;
  const st = await api('/status');
  if (st && st.stats) { state.stats = st.stats; state.lastScan = st.last_scan; }
  const iss = await api('/issues');
  if (!iss.error) state.issues = iss;
  const dups = await api('/duplicates');
  if (!dups.error) state.duplicates = dups;
  const diags = await api('/diagnostics');
  if (!diags.error) state.diagnostics = diags;
  const bios = await api('/bios');
  if (!bios.error) state.biosStatus = bios;
  const missing = await api('/covers/missing');
  if (Array.isArray(missing)) state.missingCovers = missing;
  const missingDescs = await api('/descriptions/missing');
  if (Array.isArray(missingDescs)) state.missingDescriptions = missingDescs;
  const cfg = await api('/config');
  if (!cfg.error) state.config = cfg;
  loadKB();
  const total = (state.stats && state.stats.total_files) || 0;
  toast(`Scan complete! ${total} files found`, 'success');
  state.scanProgress = null;
  render();
}

async function loadSystem(name) {
  const r = await api('/systems/' + name);
  if (!r.error) {
    state.selectedSystem = r;
    state.romPage = 0;
    state.romFilter = '';
    // Invalidate browse cache so updated cover/metadata is reflected
    delete browseRomsCache[name];
  }
  render();
}

async function moveRom(filename, fromSystem, toSystem) {
  const r = await api('/move', { method: 'POST', body: { filename, from_system: fromSystem, to_system: toSystem } });
  if (r.ok) {
    if (r.action === 'trashed_duplicate') {
      toast(`Removed misplaced copy of ${filename} — correct copy already in ${toSystem}`, 'success');
    } else {
      toast(`Moved ${filename} → ${toSystem}`, 'success');
    }
    state.diagnostics = state.diagnostics.filter(d => !(d.system === fromSystem && d.file === filename));
    state.issues = state.issues.filter(i => !(i.current_system === fromSystem && i.file === filename));
    if (state.selectedSystem) loadSystem(state.selectedSystem.folder);
    state.modal = null;
  } else {
    toast(r.error || 'Move failed', 'error');
  }
  render();
}

async function deleteRom(filename, system) {
  if (!confirm(`Move "${filename}" to trash?`)) return;
  const r = await api('/delete', { method: 'POST', body: { filename, system } });
  if (r.ok) {
    toast(`Trashed ${filename}`, 'success');
    if (state.selectedSystem) loadSystem(state.selectedSystem.folder);
  } else {
    toast(r.error || 'Delete failed', 'error');
  }
  render();
}

async function repairGamelist(system) {
  if (!confirm(`Repair gamelist.xml for "${system}"?\n\nA .bak backup will be created in the system folder before overwriting. Trailing junk after </gameList> will be stripped.`)) return;
  const r = await api('/gamelist/repair', { method: 'POST', body: { system } });
  if (r.ok && r.repaired) {
    toast(`Repaired ${system} — stripped ${r.trailing_bytes} bytes of trailing junk`, 'success');
    // Clear browse cache for this system and refresh issues + stats
    delete browseRomsCache[system];
    const iss = await api('/issues');
    if (!iss.error) state.issues = iss;
    const st = await api('/status');
    if (!st.error) { state.stats = st.stats; state.lastScan = st.last_scan; }
    if (state.selectedSystem?.folder === system) loadSystem(system);
    render();
  } else if (r.ok && !r.repaired) {
    toast(`${system} gamelist.xml is already valid`, 'info');
  } else {
    toast(`Repair failed: ${r.error || 'unknown'}${r.detail ? ' — ' + r.detail : ''}`, 'error');
  }
}

async function searchRoms(q) {
  state.searchQuery = q;
  if (q.length < 2) { state.searchResults = []; render(); return; }
  const r = await api('/search?q=' + encodeURIComponent(q));
  if (!r.error) state.searchResults = r;
  render();
}

async function bulkFixMisplaced(system) {
  if (!state.selectedSystem) return;
  const misplaced = state.selectedSystem.roms.filter(r => r.issue === 'wrong_system' && r.suggested_systems?.length === 1);
  if (!misplaced.length) { toast('No auto-fixable ROMs found', 'info'); return; }
  if (!confirm(`Auto-move ${misplaced.length} ROMs to their suggested systems?`)) return;
  const moves = misplaced.map(r => ({ filename: r.name, from_system: r.system, to_system: r.suggested_systems[0] }));
  const r = await api('/bulk-move', { method: 'POST', body: { moves } });
  if (r.results) {
    const moved = r.results.filter(x => x.status === 'moved').length;
    const dupes = r.results.filter(x => x.status === 'trashed_duplicate').length;
    const msg = [moved && `Moved ${moved}`, dupes && `removed ${dupes} duplicate(s)`].filter(Boolean).join(', ');
    toast(`${msg || '0 moved'}/${moves.length} ROMs`, 'success');
    loadSystem(system);
  }
}

async function fixAllZipContents() {
  const items = state.diagnostics.filter(d => d.key === 'wrong_zip_contents' && d.suggested_systems && d.suggested_systems.length > 0);
  if (!items.length) { toast('No wrong ZIP contents found', 'info'); return; }
  const moves = items.map(d => ({ filename: d.file, from_system: d.system, to_system: d.suggested_systems[0] }));
  const preview = moves.slice(0, 10).map(m => `${m.filename} → ${m.to_system}`).join('\n')
    + (moves.length > 10 ? `\n...and ${moves.length - 10} more` : '');
  if (!confirm(`Auto-move ${moves.length} ROM(s) to correct systems?\n\n${preview}`)) return;
  const r = await api('/bulk-move', { method: 'POST', body: { moves } });
  if (r.results) {
    const moved = r.results.filter(x => x.status === 'moved').length;
    const dupes = r.results.filter(x => x.status === 'trashed_duplicate').length;
    const errors = r.results.filter(x => x.status === 'error').length;
    const parts = [moved && `Moved ${moved}`, dupes && `removed ${dupes} duplicate(s)`, errors && `${errors} error(s)`].filter(Boolean).join(', ');
    toast(`${parts}. Re-scan to update all stats.`, errors ? 'warning' : 'success');
    // Refresh diagnostics and issues to reflect the moves
    const diags = await api('/diagnostics');
    if (!diags.error) state.diagnostics = diags;
    const iss = await api('/issues');
    if (!iss.error) state.issues = iss;
    const sys = await api('/systems');
    if (!sys.error) state.systems = sys;
    render();
  } else {

async function fixUploadBios(system, expectedFilename, file) {
  const key = 'bios/' + system + '/' + expectedFilename;
  state.fixing[key] = true;
  render();

  const fd = new FormData();
  fd.append('system', system);
  fd.append('expected_filename', expectedFilename);
  fd.append('file', file, expectedFilename);

  let r;
  try {
    // Must use raw fetch — api() hardcodes JSON content-type which breaks multipart
    const resp = await fetch(API + '/fix/upload-bios', { method: 'POST', body: fd });
    r = await resp.json();
  } catch (e) {
    delete state.fixing[key];
    toast('Upload error: ' + e.message, 'error');
    render();
    return;
  }

  delete state.fixing[key];
  if (r.ok) {
    if (r.warning) {
      toast(r.warning, 'warning');
    } else {
      const mdLabel = r.md5_match === null ? 'not checked' : (r.md5_match ? 'matches ✓' : 'differs');
      toast(`Uploaded ${r.filename} — MD5 ${mdLabel}`, 'success');
    }
    const bios = await api('/bios');
    if (!bios.error) state.biosStatus = bios;
  } else {
    toast('Upload failed: ' + (r.detail || r.error || 'unknown error'), 'error');
  }
  render();
}

async function loadCatalogSystems() {
  state.catalogLoading = true;
  const r = await api('/catalog/systems');
  state.catalogLoading = false;
  state.catalogSystemsList = (r && Array.isArray(r.systems)) ? r.systems : [];
  if (state.catalogSystemsList.length && !state.catalogSystem) {
    state.catalogSystem = state.catalogSystemsList[0].system;
    await loadCatalog();
    return;
  }
  render();
}

async function loadCatalog() {
  if (!state.catalogSystem) { render(); return; }
  state.catalogLoading = true;
  const qs = `?q=${encodeURIComponent(state.catalogQuery || '')}&page=${state.catalogPage}`;
  const r = await api('/catalog/' + encodeURIComponent(state.catalogSystem) + qs);
  state.catalogLoading = false;
  if (r && Array.isArray(r.games)) {
    state.catalog = r.games;
    state.catalogTotal = r.total || 0;
  } else {
    state.catalog = [];
    state.catalogTotal = 0;
    if (r && r.error) toast('Catalog error: ' + r.error, 'error');
  }
  render();
}

function selectCatalogSystem(sys) {
  if (state.catalogSystem === sys) return;
  state.catalogSystem = sys;
  state.catalogPage = 0;
  state.catalogQuery = '';
  loadCatalog();
}

function setCatalogPage(p) {
  const pages = Math.max(1, Math.ceil(state.catalogTotal / 100));
  state.catalogPage = Math.min(Math.max(0, p), pages - 1);
  loadCatalog();
}

async function downloadRom(system, filename) {
  const key = system + '/' + filename;
  if (state.catalogDownloading[key]) return;
  state.catalogDownloading[key] = true;
  render();
  const r = await api('/catalog/download', { method: 'POST', body: { system, filename } });
  delete state.catalogDownloading[key];
  if (r && r.ok) {
    const g = state.catalog.find(x => x.filename === filename);
    if (g) g.owned = true;
    if (r.action === 'exists') {
      toast(filename + ' is already present', 'info');
    } else {
      const extras = [];
      if (r.cover) extras.push('cover' + (r.cover_source ? ' via ' + r.cover_source : ''));
      if (r.description) extras.push('description');
      toast('Downloaded ' + filename + (extras.length ? ' (+ ' + extras.join(', ') + ')' : ''), 'success');
      if (r.ext_warning) toast(r.ext_warning, 'warning');
    }
  } else {
    const msgs = {
      download_failed: 'Download failed — archive.org may be unreachable',
      invalid_url: 'Catalog entry has an invalid URL',
      blocked_url: 'Download URL host is not allowed',
      write_error: 'Could not write the file to the share',
      mkdir_failed: 'Could not create the system folder',
    };
    toast(msgs[r && r.error] || ('Download failed: ' + ((r && (r.error || r.detail)) || 'unknown')), 'error');
  }
  render();
}

async function processCatalogQueue() {
  if (!state.catalogQueue.length) {
    state.catalogBulk = false;
    toast('Catalog downloads complete', 'success');
    render();
    return;
  }
  state.catalogBulk = true;
  const { system, filename } = state.catalogQueue.shift();
  await downloadRom(system, filename);
  setTimeout(processCatalogQueue, 1000); // gentle gap — downloads are heavier than scrapes
}

function startCatalogDownload(games) {
  if (state.catalogBulk) { toast('A bulk download is already in progress', 'info'); return; }
  const pending = games.filter(g => !g.owned);
  if (!pending.length) { toast('Nothing to download on this page', 'info'); return; }
  state.catalogQueue = pending.map(g => ({ system: state.catalogSystem, filename: g.filename }));
  processCatalogQueue();
}

// ─── Render ──────────────────────────────────────────────────────────────────
function render() {
  const app = document.getElementById('app');
  const scrollY = window.scrollY;
  const innerScrolls = [...document.querySelectorAll('.rom-table-wrap')].map(el => el.scrollTop);
  // Preserve browse scroll positions (vertical container + horizontal rows)
  const browseContainerScroll = document.querySelector('.browse-container')?.scrollTop || 0;
  const browseScrolls = {};
  document.querySelectorAll('.browse-row-scroll').forEach(el => {
    if (el.id) browseScrolls[el.id] = el.scrollLeft;
  });
  app.innerHTML = `
    ${renderHeader()}
    ${renderConfig()}
    ${state.scanning ? renderScanProgress() : ''}
    ${state.stats ? renderStats() : ''}
    ${state.stats ? renderTabs() : ''}
    ${state.stats ? renderContent() : ''}
    ${!state.stats && !state.scanning && !state.loading ? renderWelcome() : ''}
    ${state.loading ? renderLoading('Connecting to server...') : ''}
    ${state.editModal ? renderEditModal() : ''}
    ${state.modal ? renderModal() : ''}
    ${renderBugReportModal()}
    ${renderToasts()}
    ${renderFooter()}
  `;
  window.scrollTo({ top: scrollY, behavior: 'instant' });
  document.querySelectorAll('.rom-table-wrap').forEach((el, i) => {
    if (innerScrolls[i] != null) el.scrollTop = innerScrolls[i];
  });
  // Restore browse scroll positions
  const browseContainer = document.querySelector('.browse-container');
  if (browseContainer) browseContainer.scrollTop = browseContainerScroll;
  Object.entries(browseScrolls).forEach(([id, left]) => {
    const el = document.getElementById(id);
    if (el) el.scrollLeft = left;
  });
  bindEvents();
  // Set up browse lazy loading and scroll buttons
  if (state.activeTab === 'browse') {
    setupBrowseObserver();
    bindBrowseScrollButtons();
  }
}

    case 'duplicates': return renderDuplicates();
    case 'diagnostics': return renderDiagnostics();
    case 'kb': return renderKB();
    case 'covers': return renderMissingCovers();
    case 'descriptions': return renderMissingDescriptions();
    case 'catalog': return renderCatalog();

  }
}

function renderSystems() {
  let entries = Object.entries(state.systems).sort((a, b) => b[1].total_roms - a[1].total_roms);
  if (!entries.length) return '<div class="empty-state"><div class="emoji">📂</div><p>No systems found. Click "Scan ROMs" to get started.</p></div>';
  const totalCount = entries.length;
  if (state.hideEmptySystems) entries = entries.filter(([, s]) => s.total_roms > 0);
  const hiddenCount = totalCount - entries.length;
  return `
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap">
    <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:0.85rem;color:var(--text-muted);user-select:none">
      <input type="checkbox" id="hideEmptyToggle" ${state.hideEmptySystems ? 'checked' : ''}
        style="accent-color:var(--cyan);width:15px;height:15px;cursor:pointer" />
      Hide empty systems
    </label>
    ${hiddenCount > 0 ? `<span style="font-size:0.78rem;color:var(--text-dim)">(${hiddenCount} hidden)</span>` : ''}
    <span style="margin-left:auto;font-size:0.78rem;color:var(--text-dim)">${entries.length} of ${totalCount} systems</span>
  </div>
  <div class="systems-grid">
    ${entries.map(([key, s]) => `
      <div class="system-card ${s.misplaced_count > 0 ? 'has-issues' : ''}" data-system="${key}">
        <div class="sys-name">${escHtml(s.name)}</div>
        <div class="sys-folder">/${escHtml(s.folder)}</div>
        <div class="sys-stats">
          <span class="sys-ok">✓ ${s.ok_count}</span>
          ${s.misplaced_count ? `<span class="sys-warn">⚠ ${s.misplaced_count}</span>` : ''}
          ${s.unknown_count ? `<span class="sys-err">? ${s.unknown_count}</span>` : ''}
          ${s.diagnostic_count ? `<span style="color:var(--purple)">⚕ ${s.diagnostic_count}</span>` : ''}
          <span style="color:var(--text-muted)">${s.total_roms} total</span>
          <span style="color:var(--green)">🖼 ${s.cover_count||0}/${s.total_roms}</span>
          <span style="color:var(--cyan)">📝 ${s.description_count||0}/${s.total_roms}</span>
        </div>
      </div>
    `).join('')}
  </div>`;
}

function renderSystemDetail() {
  const s = state.selectedSystem;
  let roms = s.roms || [];
  if (state.romFilter) {
    const q = state.romFilter.toLowerCase();
    roms = roms.filter(r => r.name.toLowerCase().includes(q));
  }
  // Sort: issues first, then alphabetical
  roms.sort((a, b) => {
    if (a.issue && !b.issue) return -1;
    if (!a.issue && b.issue) return 1;
    return a.name.localeCompare(b.name);
  });
  const totalPages = Math.ceil(roms.length / state.ROM_PAGE_SIZE);
  const page = roms.length ? Math.min(state.romPage, totalPages - 1) : 0;
  const pageRoms = roms.slice(page * state.ROM_PAGE_SIZE, (page + 1) * state.ROM_PAGE_SIZE);

  return `
    <div class="breadcrumb">
      <a onclick="state.selectedSystem=null;render()">← Systems</a>
      <span class="sep">/</span>
      <span>${escHtml(s.name)}</span>
      <span style="color:var(--text-muted);font-size:0.8rem;margin-left:auto">${roms.length} ROMs</span>
    </div>
    <div style="display:flex;gap:10px;margin-bottom:14px;align-items:center;flex-wrap:wrap">
      <input type="text" id="romFilter" placeholder="Filter ROMs..." value="${escHtml(state.romFilter)}"
        style="flex:1;min-width:200px;padding:8px 12px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:0.85rem" />
      ${s.misplaced_count > 0 ? `<button class="btn btn-success btn-sm" onclick="bulkFixMisplaced('${s.folder}')">⚡ Auto-fix ${s.misplaced_count} misplaced</button>` : ''}
      <span style="font-size:0.75rem;color:var(--text-dim)">
        Valid: ${s.valid_extensions?.join(', ') || 'any'}
      </span>
    </div>
    <div class="rom-table-wrap" style="max-height:65vh;overflow-y:auto">
      <table>
        <thead><tr>
          <th style="width:52px">Cover</th><th>File Name</th><th>Ext</th><th>Size</th><th>Status</th><th>Desc</th><th>Actions</th>
        </tr></thead>
        <tbody>
          ${pageRoms.map(r => {
            const scrapeKey = s.folder + '/' + r.name;
            const isScraping = !!state.coverScraping[scrapeKey];
            const isDescScraping = !!state.descScraping[scrapeKey];
            const isRomFile = !r.issue;
            const coverCell = isRomFile
              ? (r.has_cover
                  ? `<img class="cover-thumb" src="${escHtml(r.cover_url)}" loading="lazy" onclick="showCoverModal('${escJs(r.cover_url)}')" title="${escHtml(r.game_name || r.name)}">`
                  : `<div class="cover-missing" title="No cover art">📷</div>`)
              : `<div style="width:36px;height:36px"></div>`;
            const descCell = isRomFile
              ? (r.has_description
                  ? `<span title="Has description" style="color:var(--green);font-size:0.9rem">📝✓</span>`
                  : `<button class="btn btn-sm" onclick="scrapeDescription('${escJs(r.name)}','${escJs(s.folder)}','${escJs(r.game_name||'')}')"
                      ${isDescScraping ? 'disabled' : ''} title="Fetch description from ScreenScraper">
                      ${isDescScraping ? '⟳' : '📝'}
                    </button>`)
              : '';
            return `<tr>
              <td style="padding:4px 8px">${coverCell}</td>
              <td class="rom-name">${escHtml(r.game_name || r.name)}<br><span style="color:var(--text-muted);font-size:0.72rem">${r.game_name ? escHtml(r.name) : ''}</span></td>
              <td><span class="rom-ext">${escHtml(r.ext)}</span></td>
              <td class="rom-size">${r.size_human}</td>
              <td>
                ${r.issue === 'wrong_system' ? `<span class="issue-badge wrong">⚠ Wrong folder</span>` :
                  r.issue === 'unknown_system' ? `<span class="issue-badge unknown">? Unknown</span>` :
                  `<span class="issue-badge ok">✓ OK</span>`}
                ${(r.diagnostics||[]).map(d => `<span class="diag-badge" title="${escHtml(diagTitle(d))}">⚕ ${escHtml(diagTitle(d))}</span>`).join(' ')}
              </td>
              <td style="text-align:center">${descCell}</td>
              <td>
                ${isRomFile ? `<button class="btn btn-sm" onclick='showEditModal(${JSON.stringify(r).replace(/\x27/g,"&#39;")}, "${escJs(s.folder)}")' title="Edit metadata">✏️</button>` : ''}
                ${r.suggested_systems?.length ? `<button class="btn btn-sm btn-success" onclick='showMoveModal(${JSON.stringify(r).replace(/'/g,"&#39;")})'>Move →</button>` : ''}
                ${isRomFile ? `<button class="btn btn-sm" onclick="scrapeCover('${escJs(r.name)}','${escJs(s.folder)}','${escJs(r.game_name||'')}')"
                  ${isScraping ? 'disabled' : ''} title="${r.has_cover ? 'Re-scrape cover' : 'Fetch cover art'}">
                  ${isScraping ? '⟳' : '🖼'}
                </button>` : ''}
                <button class="btn btn-sm btn-danger" onclick="deleteRom('${escJs(r.name)}','${s.folder}')">🗑</button>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
    ${totalPages > 1 ? `<div class="pagination">
      <button class="btn btn-sm" onclick="state.romPage=Math.max(0,state.romPage-1);render()" ${page===0?'disabled':''}>← Prev</button>
      <span class="page-info">Page ${page+1} of ${totalPages}</span>
      <button class="btn btn-sm" onclick="state.romPage=Math.min(${totalPages-1},state.romPage+1);render()" ${page>=totalPages-1?'disabled':''}>Next →</button>
    </div>` : ''}
  `;
}

function renderIssues() {
  const filters = ['all', 'misplaced', 'duplicate', 'unknown_system', 'permission_error', 'corrupted_gamelist'];
  let issues = state.issues;
  if (state.issueFilter !== 'all') issues = issues.filter(i => i.type === state.issueFilter);

  return `
    <div style="display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap">
      ${filters.map(f => `<button class="btn btn-sm ${state.issueFilter===f?'btn-primary':''}" 
        onclick="state.issueFilter='${f}';render()">${f === 'all' ? 'All' : f.replace('_',' ')}</button>`).join('')}
    </div>
    ${issues.length === 0 ? '<div class="empty-state"><div class="emoji">✨</div><p>No issues found!</p></div>' : ''}
    ${issues.slice(0, 200).map(i => {
      if (i.type === 'misplaced') return `
        <div class="issue-row">
          <div class="issue-icon">⚠️</div>
          <div class="issue-details">
            <div class="issue-file">${escHtml(i.file)}</div>
            <div class="issue-desc">In <strong>${escHtml(i.current_system)}</strong> — extension <code>${escHtml(i.ext)}</code> belongs in: ${i.suggested_systems.map(s => `<strong>${escHtml(s)}</strong>`).join(', ')}</div>
          </div>
          <div class="issue-actions">
            ${i.suggested_systems.length === 1
              ? `<button class="btn btn-sm btn-success" onclick="moveRom('${escJs(i.file)}','${escJs(i.current_system)}','${escJs(i.suggested_systems[0])}')">Move → ${escHtml(i.suggested_systems[0])}</button>`
              : `<button class="btn btn-sm" onclick='showMoveModal(${JSON.stringify({name:i.file,system:i.current_system,suggested_systems:i.suggested_systems}).replace(/\x27/g,"&#39;")})'>Choose system…</button>`}
            <button class="btn btn-sm btn-danger" onclick="deleteRom('${escJs(i.file)}','${escJs(i.current_system)}')" title="Move to trash">🗑</button>
          </div>
        </div>`;
      if (i.type === 'unknown_system') return `
        <div class="issue-row">
          <div class="issue-icon">❓</div>
          <div class="issue-details">
            <div class="issue-file">${escHtml(i.file)}</div>
            <div class="issue-desc">In <strong>${escHtml(i.current_system)}</strong> — extension <code>${escHtml(i.ext)}</code> is not recognised for any known system. This may be a non-ROM file (config, metadata, etc.).</div>
          </div>
          <div class="issue-actions">
            <button class="btn btn-sm btn-danger" onclick="deleteRom('${escJs(i.file)}','${escJs(i.current_system)}')" title="Move to trash">🗑 Trash</button>
          </div>
        </div>`;
      if (i.type === 'duplicate') return `
        <div class="issue-row">
          <div class="issue-icon">📋</div>
          <div class="issue-details">
            <div class="issue-file">Duplicate — ${i.copies.length} copies</div>
            <div class="issue-desc">${i.copies.map(c => `<strong>${escHtml(c.system)}</strong>/${escHtml(c.file)}`).join(' ⟷ ')}</div>
          </div>
          <div class="issue-actions">
            ${i.copies.slice(1).map(c => `<button class="btn btn-sm btn-danger" onclick="deleteRom('${escJs(c.file)}','${escJs(c.system)}')" title="Keep first copy, trash this one">🗑 ${escHtml(c.system)}</button>`).join('')}
          </div>
        </div>`;
      if (i.type === 'permission_error') return `
        <div class="issue-row">
          <div class="issue-icon">🔒</div>
          <div class="issue-details">
            <div class="issue-file">Permission denied — <strong>${escHtml(i.system)}</strong></div>
            <div class="issue-desc">Could not read this folder over the network share. Check that the SMB share is accessible and you have read permissions on <code>\\\\RECALBOX\\share\\roms\\${escHtml(i.system)}</code>.</div>
          </div>
        </div>`;
      if (i.type === 'corrupted_gamelist') return `
        <div class="issue-row">
          <div class="issue-icon">🧩</div>
          <div class="issue-details">
            <div class="issue-file">Corrupted gamelist.xml — <strong>${escHtml(i.system)}</strong></div>
            <div class="issue-desc">
              XML parse error: <code>${escHtml(i.error || 'unknown')}</code>.
              ${i.recovered_entries ? `Recovered <strong>${i.recovered_entries}</strong> entries from the file despite the corruption.` : 'No entries could be recovered — all metadata for this system is currently invisible.'}
              ${i.recoverable ? ' This looks auto-repairable (trailing junk after <code>&lt;/gameList&gt;</code>).' : ''}
            </div>
          </div>
          <div class="issue-actions">
            ${i.recoverable
              ? `<button class="btn btn-sm btn-success" onclick="repairGamelist('${escJs(i.system)}')" title="Backup as .bak and strip trailing junk">🔧 Repair</button>`
              : `<button class="btn btn-sm" onclick="repairGamelist('${escJs(i.system)}')" title="Attempt repair anyway">🔧 Try repair</button>`}
          </div>
        </div>`;
      return `<div class="issue-row">
        <div class="issue-icon">❓</div>
        <div class="issue-details"><div class="issue-desc">${escHtml(JSON.stringify(i))}</div></div>
      </div>`;
    }).join('')}
    ${issues.length > 200 ? `<p style="text-align:center;color:var(--text-dim);padding:12px">Showing 200 of ${issues.length} issues</p>` : ''}
  `;
}

function renderDuplicates() {
  if (!state.duplicates.length) return '<div class="empty-state"><div class="emoji">👍</div><p>No duplicates found!</p></div>';
  return state.duplicates.map(d => `
    <div class="issue-row">
      <div class="issue-icon">📋</div>
      <div class="issue-details">
        <div class="issue-file">${d.copies.length} copies</div>
        <div class="issue-desc">
          ${d.copies.map(c => `<span style="margin-right:12px"><strong>${c.system}</strong>/${escHtml(c.file)} <span class="rom-size">(${c.size_human})</span></span>`).join('')}
        </div>
      </div>
      <div class="issue-actions">
        ${d.copies.slice(1).map(c => `<button class="btn btn-sm btn-danger" onclick="deleteRom('${escJs(c.file)}','${c.system}')">🗑 ${c.system}</button>`).join('')}
      </div>
    </div>
  `).join('');
}
